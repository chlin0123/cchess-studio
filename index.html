<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src blob:; child-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>象棋打譜系統 Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>象棋打譜系統 <span class="badge" id="verifyBadge">棋譜檢驗通過</span></h1>
  <div class="toolbar">
    <select id="presetSelect" title="內建經典古譜與名局">
      <option value="">-- 選擇經典古譜 / 宗師名局 (9局) --</option>
      <option value="tiehuache">《橘中秘》棄馬十三著・鐵滑車 (已修正19步)</option>
      <option value="juzhongmi1">《橘中秘》順炮直車對橫車 (16步)</option>
      <option value="shunpao_heng">《橘中秘》順炮橫車破直車 (12步)</option>
      <option value="meihuapu">《梅花譜》屏風馬橫車破當頭炮 (12步)</option>
      <option value="pingfengma">近代定式：中炮過河車對屏風馬平炮兌車 (12步)</option>
      <option value="fangongma">近代定式：中炮對反宮馬 (12步)</option>
      <option value="huronghua">宗師名局：胡榮華「飛相局」對左中炮 (12步)</option>
      <option value="yangguanlin">宗師名局：楊官璘「中炮對左馬盤河」 (12步)</option>
      <option value="xianren">當代流行：仙人指路對卒底炮 (12步)</option>
    </select>
    <button id="btnReset">新局復原</button>
    <button id="btnFlip">翻轉棋盤</button>
    <button id="btnUndo">悔棋</button>
    <button id="btnResign" title="投子認輸並自動存檔">認輸</button>
    <button class="primary" id="btnSave">儲存打譜</button>
    <button id="btnIO">匯出 / 載入</button>
  </div>
</header>

<main>
  <div class="board-wrap">
    <canvas id="board" width="540" height="600"></canvas>
  </div>
  <div class="side-panel">
    <div class="status-bar" id="statusBar">
      <span id="turnText">紅方行棋</span>
      <span id="stepCount">第 0 步</span>
    </div>

    <div class="ai-bar">
      <select id="aiModeSelect" title="選擇對弈模式">
        <option value="off">對弈：雙人打譜 (AI 關)</option>
        <option value="B" selected>對弈：電腦執黑 (玩家紅)</option>
        <option value="R">對弈：電腦執紅 (玩家黑)</option>
      </select>
      <select id="aiLevelSelect" title="選擇 AI 對手與難度等級">
        <option value="1">Lv.1 林小軒 (街頭棋童・6層)</option>
        <option value="2">Lv.2 陳鐵山 (公園擂台主・8層)</option>
        <option value="3">Lv.3 沈滄海 (省冠國手・10層)</option>
        <option value="4" selected>Lv.4 顧千帆 (特級宗師・11層)</option>
        <option value="5">Lv.5 天璣玄極 (深算棋神・12層)</option>
      </select>
      <button id="aiHintBtn" title="請 AI 分析當前盤面並推薦最佳著法（再點一次可直接代走）">AI 支招</button>
      <button id="btnTakeover" title="從目前局面截斷後續步數，直接與 AI 續戰對弈">從此續戰</button>
    </div>

    <div class="ai-profile" id="aiProfileCard">
      <div class="ai-profile-head">
        <span id="aiProfileName">對手：顧千帆（特級宗師）</span>
        <span class="ai-profile-tag" id="aiProfileBadge">Lv.4｜11 層・上限 4 秒</span>
      </div>
      <div class="ai-profile-bio" id="aiProfileBio">殿堂級特級大師，深諳九宮氣數與子力協同。對臥槽馬、鐵門栓與悶宮殺機有極致嗅覺。</div>
      <div class="ai-profile-foot">
        <span id="aiProfileStats">對戰戰績：尚無紀錄</span>
      </div>
    </div>

    <div class="save-bar">
      <select id="savedSelect">
        <option value="">-- 我的存檔棋譜庫 (0) --</option>
      </select>
      <button id="btnDeleteSave" title="刪除選中存檔">刪除</button>
    </div>

    <div class="nav-btns">
      <button id="navFirst" title="開局 (Home)">|&lt;</button>
      <button id="navPrev" title="上一步 (←)">&lt;</button>
      <button id="navPlay" title="自動播放 / 暫停棋譜 (空白鍵)">▶ 播放</button>
      <button id="navNext" title="下一步 (→)">&gt;</button>
      <button id="navLast" title="終局 (End)">&gt;|</button>
    </div>
    <div class="move-list" id="moveList"></div>
    <div class="comment-box">
      <label class="comment-label" for="commentInput">當前步數講解 / 註解（自動隨存檔保存）：</label>
      <textarea id="commentInput" maxlength="2000" placeholder="在此輸入本步棋評或心得..."></textarea>
    </div>
  </div>
</main>

<!-- 匯出/載入 Modal -->
<div class="modal" id="ioModal">
  <div class="modal-card">
    <h3>匯出 / 載入 JSON 棋譜</h3>
    <p class="modal-hint">複製以下文字傳給其他電腦，或貼上別人的棋譜後點擊「載入棋譜」：</p>
    <textarea id="ioTextarea"></textarea>
    <div class="modal-actions">
      <button id="btnCopyIO">複製內容</button>
      <button class="primary" id="btnImport">載入棋譜</button>
      <button id="btnCloseModal">關閉</button>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
