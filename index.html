<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>象棋打譜系統 Pro</title>
<style>
  :root {
    --bg: #1e1b18;
    --panel: #2a2520;
    --wood: #e6b87c;
    --line: #4a2e14;
    --accent: #d97706;
    --text: #f3f0eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", "PingFang TC", serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
  header { background: #141210; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a322c; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 1.3rem; color: #f59e0b; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 0.75rem; background: #065f46; color: #a7f3d0; padding: 2px 8px; border-radius: 99px; font-weight: normal; letter-spacing: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { background: #3a322c; color: var(--text); border: 1px solid #574b42; padding: 6px 11px; border-radius: 6px; font-size: 0.88rem; cursor: pointer; transition: 0.15s; }
  button:hover, select:hover { background: #4d423a; border-color: #f59e0b; }
  button.primary { background: #b45309; border-color: #d97706; }
  button.primary:hover { background: #d97706; }
  main { display: flex; flex: 1; padding: 16px; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .board-wrap { position: relative; background: var(--wood); padding: 14px; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 0 18px rgba(100,50,10,0.35); border: 4px solid #784719; }
  canvas { display: block; cursor: pointer; }
  .side-panel { width: 396px; background: var(--panel); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; border: 1px solid #3f362f; max-height: 760px; }
  .status-bar { background: #1a1613; padding: 9px 12px; border-radius: 6px; font-weight: bold; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #f59e0b; }
  .status-bar.gameover { border-left-color: #ef4444; background: #2d1616; color: #fca5a5; }
  .status-bar.thinking { border-left-color: #38bdf8; background: #13222e; color: #bae6fd; }
  .ai-bar { display: flex; gap: 6px; align-items: center; background: #1c1815; padding: 7px 8px; border-radius: 6px; border: 1px solid #38302a; }
  .ai-bar select { flex: 1; min-width: 0; padding: 5px 7px; font-size: 0.84rem; }
  .ai-bar button { padding: 5px 10px; font-size: 0.84rem; background: #0f5257; border-color: #0e7490; color: #e0f2fe; white-space: nowrap; }
  .ai-bar button:hover { background: #0e7490; border-color: #38bdf8; }
  .ai-profile { background: #171411; border: 1px solid #38302a; border-left: 3px solid #d97706; border-radius: 6px; padding: 7px 10px; display: flex; flex-direction: column; gap: 3px; }
  .ai-profile-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.86rem; font-weight: bold; color: #fbbf24; }
  .ai-profile-tag { font-size: 0.72rem; background: #3a2e21; color: #fde68a; padding: 1px 7px; border-radius: 99px; font-weight: normal; }
  .ai-profile-bio { font-size: 0.78rem; color: #bfb3a6; line-height: 1.38; }
  .save-bar { display: flex; gap: 6px; align-items: center; background: #1e1a16; padding: 7px 8px; border-radius: 6px; border: 1px solid #38302a; }
  .save-bar select { flex: 1; min-width: 0; }
  .move-list { flex: 1; height: 270px; overflow-y: auto; background: #181512; border-radius: 6px; padding: 8px; border: 1px solid #38302a; display: grid; grid-template-columns: 44px 1fr 1fr; gap: 4px; align-content: start; font-size: 0.92rem; }
  .move-num { color: #887a6e; text-align: center; padding: 4px; }
  .move-item { padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  .move-item:hover { background: #332b24; }
  .move-item.active { background: #b45309; color: #fff; font-weight: bold; }
  .nav-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .comment-box { display: flex; flex-direction: column; gap: 6px; }
  .comment-box textarea { width: 100%; height: 82px; background: #181512; color: var(--text); border: 1px solid #38302a; border-radius: 6px; padding: 8px; resize: none; font-size: 0.9rem; line-height: 1.4; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 50; }
  .modal.open { display: flex; }
  .modal-card { background: var(--panel); width: 500px; max-width: 92vw; border-radius: 10px; padding: 20px; border: 1px solid #574b42; display: flex; flex-direction: column; gap: 12px; }
  .modal-card textarea { width: 100%; height: 170px; background: #141210; color: #e5e0d8; border: 1px solid #443a32; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>象棋打譜系統 <span class="badge" id="verifyBadge">棋譜檢驗通過</span></h1>
  <div class="toolbar">
    <select id="presetSelect" title="內建經典古譜與名局">
      <option value="">-- 選擇經典古譜 / 宗師名局 (9局) --</option>
      <option value="tiehuache">《橘中秘》棄馬十三著・鐵滑車 (已修正19步)</option>
      <option value="juzhongmi1">《橘中秘》順炮直車對橫車 (16步)</option>
      <option value="shunpao_heng">《橘中秘》順炮橫車破直車 (12步)</option>
      <option value="meihuapu">《梅花譜》屏風馬橫車破當頭炮 (12步)</option>
      <option value="pingfengma">近代定式：中炮過河車對屏風馬平炮兌車 (12步)</option>
      <option value="fangongma">近代定式：中炮對反宮馬 (12步)</option>
      <option value="huronghua">宗師名局：胡榮華「飛相局」對左中炮 (12步)</option>
      <option value="yangguanlin">宗師名局：楊官璘「中炮對左馬盤河」 (12步)</option>
      <option value="xianren">當代流行：仙人指路對卒底炮 (12步)</option>
    </select>
    <button onclick="resetGame()">新局復原</button>
    <button onclick="flipBoard()">翻轉棋盤</button>
    <button onclick="undoMove()">悔棋</button>
    <button class="primary" onclick="saveCurrentRecord()">儲存打譜</button>
    <button onclick="openModal()">匯出 / 載入</button>
  </div>
</header>

<main>
  <div class="board-wrap">
    <canvas id="board" width="540" height="600"></canvas>
  </div>
  <div class="side-panel">
    <div class="status-bar" id="statusBar">
      <span id="turnText">紅方行棋</span>
      <span id="stepCount">第 0 步</span>
    </div>

    <div class="ai-bar">
      <select id="aiModeSelect" onchange="onAiConfigChange()" title="選擇對弈模式">
        <option value="off">對弈：雙人打譜 (AI 關)</option>
        <option value="B" selected>對弈：電腦執黑 (玩家紅)</option>
        <option value="R">對弈：電腦執紅 (玩家黑)</option>
      </select>
      <select id="aiLevelSelect" onchange="onAiConfigChange()" title="選擇 AI 對手與難度等級">
        <option value="1">Lv.1 林小軒 (街頭棋童・5層)</option>
        <option value="2">Lv.2 陳鐵山 (公園擂台主・8層)</option>
        <option value="3">Lv.3 沈滄海 (省冠國手・12層)</option>
        <option value="4" selected>Lv.4 顧千帆 (特級宗師・14層)</option>
        <option value="5">Lv.5 天璣玄極 (深算棋神・16層)</option>
      </select>
      <button id="aiHintBtn" onclick="requestAiHint()" title="請 AI 分析當前盤面並推薦最佳著法（再點一次可直接代走）">AI 支招</button>
    </div>

    <div class="ai-profile" id="aiProfileCard">
      <div class="ai-profile-head">
        <span id="aiProfileName">對手：顧千帆（特級宗師）</span>
        <span class="ai-profile-tag" id="aiProfileBadge">Lv.4｜14 層算力</span>
      </div>
      <div class="ai-profile-bio" id="aiProfileBio">殿堂級特級大師，深諳九宮氣數與子力協同。對臥槽馬、鐵門栓與悶宮殺機有極致嗅覺。</div>
    </div>

    <div class="save-bar">
      <select id="savedSelect" onchange="loadSavedRecord()">
        <option value="">-- 我的存檔棋譜庫 (0) --</option>
      </select>
      <button onclick="deleteSavedRecord()" title="刪除選中存檔">刪除</button>
    </div>

    <div class="nav-btns">
      <button onclick="goStep(0)" title="開局">|&lt;</button>
      <button onclick="goStep(curStep - 1)" title="上一步 (←)">&lt;</button>
      <button onclick="goStep(curStep + 1)" title="下一步 (→)">&gt;</button>
      <button onclick="goStep(history.length - 1)" title="終局">&gt;|</button>
    </div>
    <div class="move-list" id="moveList"></div>
    <div class="comment-box">
      <label style="font-size:0.85rem;color:#c2b5a8;">當前步數講解 / 註解（自動隨存檔保存）：</label>
      <textarea id="commentInput" maxlength="2000" placeholder="在此輸入本步棋評或心得..." oninput="saveComment()"></textarea>
    </div>
  </div>
</main>

<!-- 匯出/載入 Modal -->
<div class="modal" id="ioModal">
  <div class="modal-card">
    <h3>匯出 / 載入 JSON 棋譜</h3>
    <p style="font-size:0.85rem;color:#b8aba0;">複製以下文字傳給其他電腦，或貼上別人的棋譜後點擊「載入棋譜」：</p>
    <textarea id="ioTextarea"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="copyIO()">複製內容</button>
      <button class="primary" onclick="importJSON()">載入棋譜</button>
      <button onclick="closeModal()">關閉</button>
    </div>
  </div>
</div>

function initBoard() {
  const b = Array.from({length:10}, () => Array(9).fill(null));
  const setup = (row, side) => {
    const order = ['R','N','B','A','K','A','B','N','R'];
    order.forEach((t, c) => b[row][c] = {s: side, t});
  };
  setup(0, 'B');
  b[2][1] = {s:'B', t:'C'}; b[2][7] = {s:'B', t:'C'};
  [0,2,4,6,8].forEach(c => b[3][c] = {s:'B', t:'P'});
  setup(9, 'R');
  b[7][1] = {s:'R', t:'C'}; b[7][7] = {s:'R', t:'C'};
  [0,2,4,6,8].forEach(c => b[6][c] = {s:'R', t:'P'});
  return b;
}

function cloneBoard(b) { return b.map(r => r.map(c => c ? {...c} : null)); }

const KNIGHT_MOVES = [
  [-2, -1, -1,  0], [-2,  1, -1,  0], [ 2, -1,  1,  0], [ 2,  1,  1,  0],
  [-1, -2,  0, -1], [ 1, -2,  0, -1], [-1,  2,  0,  1], [ 1,  2,  0,  1]
];
const BISHOP_MOVES = [[-2, -2, -1, -1], [-2, 2, -1, 1], [2, -2, 1, -1], [2, 2, 1, 1]];
const ADVISOR_MOVES = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
const KNIGHT_CHECK_OFFSETS = [
  [-2, -1, -1, -1], [-2,  1, -1,  1], [ 2, -1,  1, -1], [ 2,  1,  1,  1],
  [-1, -2, -1, -1], [ 1, -2,  1, -1], [-1,  2, -1,  1], [ 1,  2,  1,  1]
];
const ORTHO_DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

function getPseudoMoves(board, r, c) {
  const p = board[r][c];
  if (!p) return [];
  const moves = [];
  const s = p.s, t = p.t;
  if (t === 'R') {
    for (let d = 0; d < 4; d++) {
      const dr = ORTHO_DIRS[d][0], dc = ORTHO_DIRS[d][1];
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
        const target = board[nr][nc];
        if (!target) {
          moves.push([nr, nc]);
        } else {
          if (target.s !== s) moves.push([nr, nc]);
          break;
        }
        nr += dr; nc += dc;
      }
    }
  } else if (t === 'C') {
    for (let d = 0; d < 4; d++) {
      const dr = ORTHO_DIRS[d][0], dc = ORTHO_DIRS[d][1];
      let jumped = false;
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
        const target = board[nr][nc];
        if (!jumped) {
          if (!target) moves.push([nr, nc]);
          else jumped = true;
        } else if (target) {
          if (target.s !== s) moves.push([nr, nc]);
          break;
        }
        nr += dr; nc += dc;
      }
    }
  } else if (t === 'N') {
    for (let i = 0; i < 8; i++) {
      const m = KNIGHT_MOVES[i];
      const lr = r + m[2], lc = c + m[3];
      if (lr >= 0 && lr <= 9 && lc >= 0 && lc <= 8 && !board[lr][lc]) {
        const nr = r + m[0], nc = c + m[1];
        if (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
          const target = board[nr][nc];
          if (!target || target.s !== s) moves.push([nr, nc]);
        }
      }
    }
  } else if (t === 'B') {
    for (let i = 0; i < 4; i++) {
      const m = BISHOP_MOVES[i];
      const nr = r + m[0], nc = c + m[1];
      if (nr < 0 || nr > 9 || nc < 0 || nc > 8) continue;
      if ((s === 'R' && nr < 5) || (s === 'B' && nr > 4)) continue;
      if (!board[r + m[2]][c + m[3]]) {
        const target = board[nr][nc];
        if (!target || target.s !== s) moves.push([nr, nc]);
      }
    }
  } else if (t === 'A') {
    for (let i = 0; i < 4; i++) {
      const nr = r + ADVISOR_MOVES[i][0], nc = c + ADVISOR_MOVES[i][1];
      if (nc < 3 || nc > 5) continue;
      if ((s === 'R' && (nr < 7 || nr > 9)) || (s === 'B' && (nr < 0 || nr > 2))) continue;
      const target = board[nr][nc];
      if (!target || target.s !== s) moves.push([nr, nc]);
    }
  } else if (t === 'K') {
    for (let i = 0; i < 4; i++) {
      const nr = r + ORTHO_DIRS[i][0], nc = c + ORTHO_DIRS[i][1];
      if (nc < 3 || nc > 5) continue;
      if ((s === 'R' && (nr < 7 || nr > 9)) || (s === 'B' && (nr < 0 || nr > 2))) continue;
      const target = board[nr][nc];
      if (!target || target.s !== s) moves.push([nr, nc]);
    }
  } else if (t === 'P') {
    const nr = r + (s === 'R' ? -1 : 1);
    if (nr >= 0 && nr <= 9) {
      const target = board[nr][c];
      if (!target || target.s !== s) moves.push([nr, c]);
    }
    if ((s === 'R' && r <= 4) || (s === 'B' && r >= 5)) {
      if (c > 0 && (!board[r][c - 1] || board[r][c - 1].s !== s)) moves.push([r, c - 1]);
      if (c < 8 && (!board[r][c + 1] || board[r][c + 1].s !== s)) moves.push([r, c + 1]);
    }
  }
  return moves;
}

function hasKing(board, side) {
  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      if (board[r][c] && board[r][c].s === side && board[r][c].t === 'K') return true;
    }
  }
  return false;
}

function isInCheck(board, side) {
  let kr = -1, kc = -1;
  for (let r = 0; r < 10; r++) {
    const row = board[r];
    for (let c = 0; c < 9; c++) {
      const p = row[c];
      if (p && p.s === side && p.t === 'K') {
        kr = r; kc = c; break;
      }
    }
    if (kr !== -1) break;
  }
  if (kr === -1) return true;
  const opp = side === 'R' ? 'B' : 'R';

  for (let d = 0; d < 4; d++) {
    const dr = ORTHO_DIRS[d][0], dc = ORTHO_DIRS[d][1];
    let jumped = false;
    let r = kr + dr, c = kc + dc;
    while (r >= 0 && r <= 9 && c >= 0 && c <= 8) {
      const p = board[r][c];
      if (p) {
        if (!jumped) {
          if (p.s === opp && (p.t === 'R' || p.t === 'K')) return true;
          jumped = true;
        } else {
          if (p.s === opp && p.t === 'C') return true;
          break;
        }
      }
      r += dr;
      c += dc;
    }
  }

  for (let i = 0; i < 8; i++) {
    const off = KNIGHT_CHECK_OFFSETS[i];
    const nr = kr + off[0], nc = kc + off[1];
    if (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
      const p = board[nr][nc];
      if (p && p.s === opp && p.t === 'N') {
        if (!board[kr + off[2]][kc + off[3]]) return true;
      }
    }
  }

  const pDir = opp === 'R' ? 1 : -1;
  const pr = kr + pDir;
  if (pr >= 0 && pr <= 9) {
    const p = board[pr][kc];
    if (p && p.s === opp && p.t === 'P') return true;
  }
  if (kc > 0) {
    const p = board[kr][kc - 1];
    if (p && p.s === opp && p.t === 'P') return true;
  }
  if (kc < 8) {
    const p = board[kr][kc + 1];
    if (p && p.s === opp && p.t === 'P') return true;
  }
  return false;
}

function getLegalMoves(board, r, c) {
  const p = board[r][c];
  if (!p) return [];
  return getPseudoMoves(board, r, c).filter(([tr, tc]) => {
    const nextB = cloneBoard(board);
    nextB[tr][tc] = nextB[r][c];
    nextB[r][c] = null;
    return !isInCheck(nextB, p.s);
  });
}

function hasAnyLegalMove(board, side) {
  if (!hasKing(board, side)) return false;
  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      if (board[r][c] && board[r][c].s === side) {
        if (getLegalMoves(board, r, c).length > 0) return true;
      }
    }
  }
  return false;
}

function evaluateGameState(board, turn) {
  if (!hasKing(board, 'R')) return { over: true, winner: 'B', reason: '帥被吃，黑方勝！' };
  if (!hasKing(board, 'B')) return { over: true, winner: 'R', reason: '將被吃，紅方勝！' };
  if (!hasAnyLegalMove(board, turn)) {
    const inCheck = isInCheck(board, turn);
    const winner = turn === 'R' ? 'B' : 'R';
    const winName = winner === 'R' ? '紅方勝' : '黑方勝';
    return {
      over: true,
      winner,
      reason: inCheck ? `絕殺！${winName}` : `困斃！${winName}`
    };
  }
  return { over: false, inCheck: isInCheck(board, turn) };
}

function validateAllPresets() {
  let totalSteps = 0;
  for (const [key, preset] of Object.entries(PRESETS)) {
    let b = initBoard();
    let turn = 'R';
    preset.moves.forEach((m, idx) => {
      const [fr, fc] = m.f, [tr, tc] = m.t;
      const p = b[fr][fc];
      if (!p || p.s !== turn) throw new Error(`棋譜 [${preset.title}] 第 ${idx+1} 步無子或輪次錯誤`);
      const legal = getLegalMoves(b, fr, fc);
      if (!legal.some(([lr, lc]) => lr === tr && lc === tc)) {
        throw new Error(`棋譜 [${preset.title}] 第 ${idx+1} 步 (${m.c}) 違反行棋規則！`);
      }
      b[tr][tc] = b[fr][fc];
      b[fr][fc] = null;
      turn = turn === 'R' ? 'B' : 'R';
      totalSteps++;
    });
  }
  const badge = document.getElementById('verifyBadge');
  badge.textContent = `9局 / ${totalSteps}步 規則檢驗通過`;
}

function resetGame(skipAiTrigger = false) {
  if (typeof stopPondering === 'function') stopPondering();
  aiSessionId++;
  aiThinking = false;
  hintMove = null;
  history = [{ board: initBoard(), turn: 'R', notation: '開局', comment: '初始盤面，紅方先行。', lastMove: null }];
  curStep = 0;
  selected = null;
  validMoves = [];
  renderAll();
  if (!skipAiTrigger) maybeTriggerAi();
}

function getNotation(board, fr, fc, tr, tc) {
  const p = board[fr][fc];
  const name = PIECE_NAMES[p.s][p.t];
  const fileFrom = p.s === 'R' ? 9 - fc : fc + 1;
  const fileTo = p.s === 'R' ? 9 - tc : tc + 1;
  const numFmt = p.s === 'R' ? NUM_CN : NUM_FW;
  const dist = Math.abs(tr - fr);
  let dir = '';
  if (tr === fr) dir = '平';
  else if ((p.s === 'R' && tr < fr) || (p.s === 'B' && tr > fr)) dir = '進';
  else dir = '退';
  const target = (tr === fr || ['N','B','A'].includes(p.t)) ? numFmt[fileTo] : numFmt[dist];
  return `${name}${numFmt[fileFrom]}${dir}${target}`;
}

function makeMove(fr, fc, tr, tc, comment = "", skipAiTrigger = false) {
  if (typeof stopPondering === 'function') stopPondering(true);
  const cur = history[curStep];
  const nextB = cloneBoard(cur.board);
  const notation = getNotation(cur.board, fr, fc, tr, tc);
  nextB[tr][tc] = nextB[fr][fc];
  nextB[fr][fc] = null;
  history = history.slice(0, curStep + 1);
  history.push({
    board: nextB,
    turn: cur.turn === 'R' ? 'B' : 'R',
    notation,
    comment,
    lastMove: {fr, fc, tr, tc}
  });
  curStep++;
  selected = null;
  validMoves = [];
  hintMove = null;
  if (!skipAiTrigger) autoSaveFinishedGame();
  renderAll();
  if (!skipAiTrigger) maybeTriggerAi();
}

// ==================== 終局自動存檔（僅存於使用者自己瀏覽器的 localStorage） ====================
const MAX_AUTO_SAVES = 100;

function formatAutoSaveTime(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function autoSaveFinishedGame() {
  const cur = history[curStep];
  if (!cur || curStep < 1) return;
  const state = evaluateGameState(cur.board, cur.turn);
  if (!state.over || (state.winner !== 'R' && state.winner !== 'B')) return;

  const prof = AI_PROFILES[aiLevel] || AI_PROFILES[4];
  let resultTag, opponent;
  if (aiMode === 'R' || aiMode === 'B') {
    const playerSide = aiMode === 'R' ? 'B' : 'R';
    resultTag = state.winner === playerSide ? '勝' : '負';
    opponent = `Lv.${aiLevel}${prof.name}`;
  } else {
    resultTag = state.winner === 'R' ? '紅勝' : '黑勝';
    opponent = '雙人';
  }
  const now = new Date();
  const title = `[自動][${resultTag}] ${opponent} ${formatAutoSaveTime(now)}`.slice(0, 60);
  if (FORBIDDEN_KEYS.has(title)) return;

  const steps = history.slice(1, curStep + 1).map(h => ({
    f: [h.lastMove.fr, h.lastMove.fc],
    t: [h.lastMove.tr, h.lastMove.tc],
    c: typeof h.comment === 'string' ? h.comment.slice(0, 2000) : ''
  }));
  if (steps.length === 0 || steps.length > MAX_STEPS) return;

  const records = getSavedRecords();
  records[title] = {
    title,
    updatedAt: now.toISOString(),
    auto: true,
    result: resultTag,
    opponent,
    reason: state.reason,
    steps
  };

  // 自動存檔最多保留 MAX_AUTO_SAVES 筆，超過時刪除最舊的自動存檔（手動存檔永不刪除）
  const autoKeys = Object.keys(records)
    .filter(k => records[k] && records[k].auto === true)
    .sort((a, b) => String(records[a].updatedAt || '').localeCompare(String(records[b].updatedAt || '')));
  while (autoKeys.length > MAX_AUTO_SAVES) {
    delete records[autoKeys.shift()];
  }

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch (err) {
    cur.autoSaveFailed = true;
    return;
  }
  cur.autoSavedTitle = title;
  refreshSavedSelect(title);
}

function b2s(r, c) {
  const rr = flipped ? 9 - r : r;
  const cc = flipped ? 8 - c : c;
  return [OX + cc * CELL, OY + rr * CELL];
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#4a2e14';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(OX - 6, OY - 6, CELL * 8 + 12, CELL * 9 + 12);

  for (let r = 0; r < 10; r++) {
    ctx.beginPath();
    ctx.moveTo(OX, OY + r * CELL);
    ctx.lineTo(OX + 8 * CELL, OY + r * CELL);
    ctx.stroke();
  }
  for (let c = 0; c < 9; c++) {
    ctx.beginPath();
    ctx.moveTo(OX + c * CELL, OY);
    ctx.lineTo(OX + c * CELL, OY + 4 * CELL);
    ctx.moveTo(OX + c * CELL, OY + 5 * CELL);
    ctx.lineTo(OX + c * CELL, OY + 9 * CELL);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(OX, OY + 4 * CELL); ctx.lineTo(OX, OY + 5 * CELL);
  ctx.moveTo(OX + 8 * CELL, OY + 4 * CELL); ctx.lineTo(OX + 8 * CELL, OY + 5 * CELL);
  ctx.moveTo(OX + 3 * CELL, OY); ctx.lineTo(OX + 5 * CELL, OY + 2 * CELL);
  ctx.moveTo(OX + 5 * CELL, OY); ctx.lineTo(OX + 3 * CELL, OY + 2 * CELL);
  ctx.moveTo(OX + 3 * CELL, OY + 7 * CELL); ctx.lineTo(OX + 5 * CELL, OY + 9 * CELL);
  ctx.moveTo(OX + 5 * CELL, OY + 7 * CELL); ctx.lineTo(OX + 3 * CELL, OY + 9 * CELL);
  ctx.stroke();

  ctx.fillStyle = '#4a2e14';
  ctx.font = 'bold 22px "Kaiti TC", "STKaiti", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('楚 河', OX + 2 * CELL, OY + 4.5 * CELL);
  ctx.fillText('漢 界', OX + 6 * CELL, OY + 4.5 * CELL);

  const cur = history[curStep];
  if (cur.lastMove) {
    const {fr, fc, tr, tc} = cur.lastMove;
    [[fr,fc],[tr,tc]].forEach(([r,c]) => {
      const [x, y] = b2s(r, c);
      ctx.strokeStyle = 'rgba(217, 119, 6, 0.85)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 24, y - 24, 48, 48);
    });
  }

  if (hintMove) {
    const [fx, fy] = b2s(hintMove.fr, hintMove.fc);
    const [tx, ty] = b2s(hintMove.tr, hintMove.tc);
    ctx.save();
    ctx.strokeStyle = 'rgba(14, 165, 233, 0.95)';
    ctx.lineWidth = 3.5;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(fx - 26, fy - 26, 52, 52);
    ctx.strokeRect(tx - 26, ty - 26, 52, 52);
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.restore();
  }

  validMoves.forEach(([r, c]) => {
    const [x, y] = b2s(r, c);
    ctx.fillStyle = 'rgba(22, 163, 74, 0.8)';
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
  });

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const p = cur.board[r][c];
      if (!p) continue;
      const [x, y] = b2s(r, c);
      const isSel = selected && selected[0] === r && selected[1] === c;
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, isSel ? 25 : 23, 0, Math.PI * 2);
      ctx.fillStyle = '#f7dfba';
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = isSel ? 10 : 4;
      ctx.shadowOffsetY = 3;
      ctx.fill();
      ctx.lineWidth = isSel ? 3 : 2;
      ctx.strokeStyle = isSel ? '#f59e0b' : (p.s === 'R' ? '#b91c1c' : '#1f2937');
      ctx.stroke();
      ctx.fillStyle = p.s === 'R' ? '#b91c1c' : '#111827';
      ctx.font = 'bold 23px "Kaiti TC", "Microsoft JhengHei", serif';
      ctx.fillText(PIECE_NAMES[p.s][p.t], x, y + 1);
      ctx.restore();
    }
  }
}

canvas.addEventListener('click', e => {
  if (aiThinking) return;
  const cur = history[curStep];
  if (aiMode === cur.turn) return;
  const state = evaluateGameState(cur.board, cur.turn);
  if (state.over) return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  let c = Math.round((x - OX) / CELL);
  let r = Math.round((y - OY) / CELL);
  if (c < 0 || c > 8 || r < 0 || r > 9) return;
  if (flipped) { r = 9 - r; c = 8 - c; }

  if (selected) {
    if (validMoves.some(([vr, vc]) => vr === r && vc === c)) {
      makeMove(selected[0], selected[1], r, c);
      return;
    }
  }
  const p = cur.board[r][c];
  if (p && p.s === cur.turn) {
    selected = [r, c];
    validMoves = getLegalMoves(cur.board, r, c);
  } else {
    selected = null;
    validMoves = [];
  }
  drawBoard();
});

function goStep(s) {
  if (s < 0 || s >= history.length) return;
  if (typeof stopPondering === 'function') stopPondering();
  aiSessionId++;
  aiThinking = false;
  hintMove = null;
  curStep = s;
  selected = null;
  validMoves = [];
  renderAll();
  if (typeof startPonderingIfNeeded === 'function') startPonderingIfNeeded();
}
function undoMove() {
  if (curStep <= 0) return;
  if (typeof stopPondering === 'function') stopPondering();
  aiSessionId++;
  aiThinking = false;
  hintMove = null;
  const cur = history[curStep];
  if (aiMode !== 'off' && cur.turn !== aiMode && curStep >= 2) {
    goStep(curStep - 2);
  } else {
    goStep(curStep - 1);
  }
}
function flipBoard() { flipped = !flipped; drawBoard(); }
function saveComment() { history[curStep].comment = document.getElementById('commentInput').value.slice(0, 2000); }

const PIECE_IDX = { R_K:0, R_A:1, R_B:2, R_N:3, R_R:4, R_C:5, R_P:6, B_K:7, B_A:8, B_B:9, B_N:10, B_R:11, B_C:12, B_P:13 };
const ZOBRIST_LO = Array.from({ length: 14 }, () => new Uint32Array(90));
const ZOBRIST_HI = Array.from({ length: 14 }, () => new Uint32Array(90));
let Z_SIDE_LO = 0, Z_SIDE_HI = 0;
(function initZobrist() {
  let seed = 0x9E3779B9;
  const nextRand = () => {
    seed ^= seed << 13;
    seed ^= seed >>> 17;
    seed ^= seed << 5;
    return seed >>> 0;
  };
  for (let p = 0; p < 14; p++) {
    for (let sq = 0; sq < 90; sq++) {
      ZOBRIST_LO[p][sq] = nextRand();
      ZOBRIST_HI[p][sq] = nextRand();
    }
  }
  Z_SIDE_LO = nextRand();
  Z_SIDE_HI = nextRand();
})();

function computeBoardHash(board, turn) {
  let lo = turn === 'B' ? Z_SIDE_LO : 0;
  let hi = turn === 'B' ? Z_SIDE_HI : 0;
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (!p) continue;
      const idx = PIECE_IDX[p.s + '_' + p.t];
      const sq = r * 9 + c;
      lo = (lo ^ ZOBRIST_LO[idx][sq]) >>> 0;
      hi = (hi ^ ZOBRIST_HI[idx][sq]) >>> 0;
    }
  }
  return [lo, hi];
}

const TT_BITS = 19;
const TT_SIZE = 1 << TT_BITS;
const TT_MASK = TT_SIZE - 1;
const ttKeyLo = new Uint32Array(TT_SIZE);
const ttKeyHi = new Uint32Array(TT_SIZE);
const ttDepth = new Int8Array(TT_SIZE);

function encodeMove(fr, fc, tr, tc) {
  return ((fr * 9 + fc) << 7) | (tr * 9 + tc);
}

function getPstBonus(p, r, c) {
  const rr = p.s === 'R' ? r : 9 - r;
  const cc = p.s === 'R' ? c : 8 - c;
  if (p.t === 'P') return PST_P[rr][cc];
  if (p.t === 'N') return PST_N[rr][cc];
  if (p.t === 'R') return PST_R[rr][cc];
  if (p.t === 'C') return PST_C[rr][cc];
  if (p.t === 'A') return (rr === 8 && cc === 4) ? 32 : 8;
  if (p.t === 'B') return (rr === 7 && cc === 4) ? 32 : 8;
  if (p.t === 'K') return (rr === 9 && cc === 4) ? 25 : 0;
  return 0;
}

function evaluateBoard(board, useTactics = true) {
  let score = 0;
  let rRooks = 0, bRooks = 0, rCannons = 0, bCannons = 0;
  let rAdv = 0, bAdv = 0, rBish = 0, bBish = 0;
  let rKr = 9, rKc = 4, bKr = 0, bKc = 4;
  let rDevRooks = 0, bDevRooks = 0;
  let rDevHorses = 0, bDevHorses = 0;

  for (let r = 0; r < 10; r++) {
    const row = board[r];
    for (let c = 0; c < 9; c++) {
      const p = row[c];
      if (!p) continue;
      const val = PIECE_VAL[p.t] + getPstBonus(p, r, c);
      if (p.s === 'R') {
        score += val;
        if (p.t === 'R') {
          rRooks++;
          if (!(r === 9 && (c === 0 || c === 8))) rDevRooks++;
        } else if (p.t === 'N') {
          if (!(r === 9 && (c === 1 || c === 7))) rDevHorses++;
        } else if (p.t === 'C') rCannons++;
        else if (p.t === 'A') rAdv++;
        else if (p.t === 'B') rBish++;
        else if (p.t === 'K') { rKr = r; rKc = c; }
      } else {
        score -= val;
        if (p.t === 'R') {
          bRooks++;
          if (!(r === 0 && (c === 0 || c === 8))) bDevRooks++;
        } else if (p.t === 'N') {
          if (!(r === 0 && (c === 1 || c === 7))) bDevHorses++;
        } else if (p.t === 'C') bCannons++;
        else if (p.t === 'A') bAdv++;
        else if (p.t === 'B') bBish++;
        else if (p.t === 'K') { bKr = r; bKc = c; }
      }
    }
  }

  if (!useTactics) return score;

  // 1. 仕相全與缺仕怕雙車、缺相怕炮
  if (rAdv === 2 && rBish === 2) score += 40;
  if (bAdv === 2 && bBish === 2) score -= 40;
  if (rAdv < 2 && bRooks > 0) score -= (2 - rAdv) * bRooks * 105;
  if (bAdv < 2 && rRooks > 0) score += (2 - bAdv) * rRooks * 105;
  if (rBish < 2 && bCannons > 0) score -= (2 - rBish) * 70;
  if (bBish < 2 && rCannons > 0) score += (2 - bBish) * 70;

  // 2. 九宮將帥氣數（防止馬/士塞死將門遭臥槽馬或悶宮一擊必殺）
  let rLiberties = 0, bLiberties = 0;
  if (rKr > 7 && !board[rKr - 1][rKc]) rLiberties++;
  if (rKr < 9 && !board[rKr + 1][rKc]) rLiberties++;
  if (rKc > 3 && !board[rKr][rKc - 1]) rLiberties++;
  if (rKc < 5 && !board[rKr][rKc + 1]) rLiberties++;
  if (bKr > 0 && !board[bKr - 1][bKc]) bLiberties++;
  if (bKr < 2 && !board[bKr + 1][bKc]) bLiberties++;
  if (bKc > 3 && !board[bKr][bKc - 1]) bLiberties++;
  if (bKc < 5 && !board[bKr][bKc + 1]) bLiberties++;
  if (rLiberties === 0) score -= 165;
  else if (rLiberties === 1) score -= 45;
  if (bLiberties === 0) score += 165;
  else if (bLiberties === 1) score += 45;

  // 3. 戰術大腦：攻王緊湊度、空頭炮／鎮中牽制／鐵門栓、臥槽掛角馬、憋馬腿、孤炮貪吃懲罰
  for (let r = 0; r < 10; r++) {
    const row = board[r];
    for (let c = 0; c < 9; c++) {
      const p = row[c];
      if (!p || p.t === 'K' || p.t === 'A' || p.t === 'B') continue;
      const isRed = p.s === 'R';
      const sign = isRed ? 1 : -1;
      const oppKr = isRed ? bKr : rKr;
      const oppKc = isRed ? bKc : rKc;
      const oppLib = isRed ? bLiberties : rLiberties;
      const distToKing = Math.abs(r - oppKr) + Math.abs(c - oppKc);

      if (p.t === 'N') {
        let openLegs = 0;
        if (r > 0 && !board[r - 1][c]) openLegs++;
        if (r < 9 && !board[r + 1][c]) openLegs++;
        if (c > 0 && !board[r][c - 1]) openLegs++;
        if (c < 8 && !board[r][c + 1]) openLegs++;
        if (openLegs === 0) score -= sign * 80;
        else if (openLegs === 1) score -= sign * 35;
        else if (openLegs >= 3) score += sign * 22;

        // 攻王緊湊度 + 臥槽馬／掛角馬（若敵方九宮氣數不足則殺傷力倍增）
        score += sign * Math.max(0, 11 - distToKing) * 7;
        const rr = isRed ? r : 9 - r;
        if (rr === 8 && c === 4) {
          score -= sign * 120; // 窩心馬塞死九宮中樞重罰
        } else if (rr === 1 && (c === 2 || c === 6) && !board[isRed ? 1 : 8][c === 2 ? 3 : 5]) {
          score += sign * (oppLib <= 1 ? 160 : 85); // 臥槽馬
        } else if (rr === 2 && (c === 3 || c === 5)) {
          score += sign * (oppLib <= 1 ? 110 : 55); // 掛角馬
        } else if (rr === 3 && (c === 2 || c === 3 || c === 5 || c === 6)) {
          score += sign * (oppLib <= 1 ? 65 : 30);  // 準臥槽躍馬威脅
        }
      } else if (p.t === 'R') {
        score += sign * Math.max(0, 12 - distToKing) * 7;
        let blocked = false;
        if (isRed) {
          for (let rr = r - 1; rr >= 3; rr--) if (board[rr][c]) { blocked = true; break; }
          if (!blocked) score += 42;
          if (r <= 2 && c >= 2 && c <= 6) score += 48;
        } else {
          for (let rr = r + 1; rr <= 6; rr++) if (board[rr][c]) { blocked = true; break; }
          if (!blocked) score -= 42;
          if (r >= 7 && c >= 2 && c <= 6) score -= 48;
        }
        // 車對敵帥同線絕對牽制
        if (c === oppKc) {
          const lo = Math.min(r, oppKr), hi = Math.max(r, oppKr);
          let cnt = 0, pinnedP = null;
          for (let rr = lo + 1; rr < hi; rr++) {
            if (board[rr][c]) { cnt++; pinnedP = board[rr][c]; }
          }
          if (cnt === 1 && pinnedP && pinnedP.s !== p.s) {
            score += sign * (pinnedP.t === 'N' || pinnedP.t === 'C' ? 120 : 80);
          }
        }
      } else if (p.t === 'C') {
        score += sign * Math.max(0, 11 - distToKing) * 4;
        // 防止「雙車未出、孤炮過河貪吃邊兵」或「單馬未出急架中炮」
        if (isRed) {
          if (r <= 4 && rDevRooks === 0 && rRooks > 0) score -= 70;
          else if (r <= 4 && rDevRooks === 1 && rRooks === 2 && (c === 0 || c === 8)) score -= 45;
          if (r === 7 && c === 4 && rDevHorses < 2 && board[2][4] && board[2][4].s === 'B' && board[2][4].t === 'C') score -= 40;
        } else {
          if (r >= 5 && bDevRooks === 0 && bRooks > 0) score += 70;
          else if (r >= 5 && bDevRooks === 1 && bRooks === 2 && (c === 0 || c === 8)) score += 45;
          if (r === 2 && c === 4 && bDevHorses < 2 && board[7][4] && board[7][4].s === 'R' && board[7][4].t === 'C') score += 40;
        }
        if (c === oppKc) {
          const lo = Math.min(r, oppKr), hi = Math.max(r, oppKr);
          let between = 0, woxinHorse = false;
          for (let rr = lo + 1; rr < hi; rr++) {
            const bp = board[rr][c];
            if (bp) {
              between++;
              if (bp.s !== p.s && bp.t === 'N' && (rr === 1 || rr === 8) && c === 4) woxinHorse = true;
            }
          }
          if (between === 0 && hi - lo >= 2) score += sign * 240; // 空頭炮
          else if (between === 1) score += sign * 95;             // 當頭炮將軍威脅
          else if (between === 2) {
            score += sign * (woxinHorse ? 220 : 60);              // 鎮中牽制 / 窩心馬被栓重罰
            if ((isRed && rRooks > 0) || (!isRed && bRooks > 0)) score += sign * 45; // 鐵門栓配合威脅
          }
        }
        if ((isRed && r === 0) || (!isRed && r === 9)) score += sign * 50; // 沉底炮
      } else if (p.t === 'P') {
        if ((isRed && r <= 4) || (!isRed && r >= 5)) {
          score += sign * Math.max(0, 9 - distToKing) * 8;
          if (c < 8 && board[r][c + 1] && board[r][c + 1].s === p.s && board[r][c + 1].t === 'P') {
            score += sign * 35; // 過河連環兵
          }
        }
      }
    }
  }
  return score;
}

function generateOrderedMoves(board, side, ply, ttMove, capturesOnly) {
  const moves = [];
  const k1 = killerMove1[ply] || 0;
  const k2 = killerMove2[ply] || 0;
  const oppSide = side === 'R' ? 'B' : 'R';
  let oppKr = oppSide === 'R' ? 9 : 0, oppKc = 4;
  for (let r = (oppSide === 'R' ? 7 : 0); r <= (oppSide === 'R' ? 9 : 2); r++) {
    for (let c = 3; c <= 5; c++) {
      const kp = board[r][c];
      if (kp && kp.s === oppSide && kp.t === 'K') { oppKr = r; oppKc = c; break; }
    }
  }

  for (let r = 0; r < 10; r++) {
    const row = board[r];
    for (let c = 0; c < 9; c++) {
      const p = row[c];
      if (!p || p.s !== side) continue;
      const pseudo = getPseudoMoves(board, r, c);
      for (let i = 0; i < pseudo.length; i++) {
        const tr = pseudo[i][0], tc = pseudo[i][1];
        const target = board[tr][tc];
        if (capturesOnly && !target) continue;
        const code = encodeMove(r, c, tr, tc);
        let orderScore = 0;
        if (code === ttMove) {
          orderScore = 2000000;
        } else if (target) {
          orderScore = 200000 + PIECE_VAL[target.t] * 12 - PIECE_VAL[p.t];
        } else {
          if (code === k1) orderScore = 150000;
          else if (code === k2) orderScore = 140000;
          else {
            orderScore = Math.min(85000, historyHeuristic[(r * 9 + c) * 90 + (tr * 9 + tc)]) + (getPstBonus(p, tr, tc) - getPstBonus(p, r, c));
            // 優先排序對敵將的臥槽馬、掛角馬與車炮同線叫將威脅
            if (p.t === 'N') {
              const dr = Math.abs(tr - oppKr), dc = Math.abs(tc - oppKc);
              if ((dr === 2 && dc === 1) || (dr === 1 && dc === 2)) orderScore += 95000;
            } else if ((p.t === 'R' || p.t === 'C') && (tr === oppKr || tc === oppKc)) {
              orderScore += 55000;
            }
          }
        }
        moves.push({ fr: r, fc: c, tr, tc, code, orderScore });
      }
    }
  }
  moves.sort((a, b) => b.orderScore - a.orderScore);
  return moves;
}

function getAllLegalMoves(board, side, capturesOnly = false, ttMove = 0) {
  const pseudo = generateOrderedMoves(board, side, 0, ttMove, capturesOnly);
  const legal = [];
  for (let i = 0; i < pseudo.length; i++) {
    const m = pseudo[i];
    const mover = board[m.fr][m.fc];
    const captured = board[m.tr][m.tc];
    board[m.tr][m.tc] = mover;
    board[m.fr][m.fc] = null;
    const safe = !isInCheck(board, side);
    board[m.fr][m.fc] = mover;
    board[m.tr][m.tc] = captured;
    if (safe) legal.push(m);
  }
  return legal;
}

function quiesce(board, alpha, beta, turn, qDepth, ply, useTactics, deadline) {
  searchNodes++;
  if ((searchNodes & 511) === 0 && performance.now() > deadline) {
    searchAborted = true;
    return 0;
  }
  const inChk = isInCheck(board, turn);
  if (!inChk) {
    const standPat = evaluateBoard(board, useTactics) * (turn === 'R' ? 1 : -1);
    if (standPat >= beta) return beta;
    if (standPat > alpha) alpha = standPat;
    if (qDepth <= 0) return standPat;
  } else if (qDepth <= -3) {
    return evaluateBoard(board, useTactics) * (turn === 'R' ? 1 : -1);
  }

  const moves = generateOrderedMoves(board, turn, ply, 0, !inChk);
  const nextTurn = turn === 'R' ? 'B' : 'R';
  let legalCount = 0;

  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    const mover = board[m.fr][m.fc];
    const captured = board[m.tr][m.tc];
    if (captured && captured.t === 'K') return 19500 - ply * 10;

    board[m.tr][m.tc] = mover;
    board[m.fr][m.fc] = null;
    if (isInCheck(board, turn)) {
      board[m.fr][m.fc] = mover;
      board[m.tr][m.tc] = captured;
      continue;
    }
    legalCount++;
    const score = -quiesce(board, -beta, -alpha, nextTurn, qDepth - 1, ply + 1, useTactics, deadline);
    board[m.fr][m.fc] = mover;
    board[m.tr][m.tc] = captured;

    if (searchAborted) return 0;
    if (score >= beta) return beta;
    if (score > alpha) alpha = score;
  }

  if (inChk && legalCount === 0) return -19000 + ply * 10;
  return alpha;
}

function negamax(board, depth, alpha, beta, turn, ply, hLo, hHi, allowNull, useTactics, qMax, deadline, inChkKnown = null) {
  searchNodes++;
  if ((searchNodes & 511) === 0 && performance.now() > deadline) {
    searchAborted = true;
    return 0;
  }

  // 循環重複局面檢測（防止優勢時無意義來回長捉或長將）
  if (ply > 0 && allowNull) {
    if (gameHashSet.has(hLo)) return -35;
    for (let p = ply - 2; p >= 0; p -= 2) {
      if (pathHashLo[p] === hLo) return -35;
    }
  }
  if (ply < 64) pathHashLo[ply] = hLo;

  const inChk = inChkKnown !== null ? inChkKnown : isInCheck(board, turn);
  if (inChk && ply < 30) depth++;

  if (depth <= 0) {
    if (qMax > 0) return quiesce(board, alpha, beta, turn, qMax, ply, useTactics, deadline);
    return evaluateBoard(board, useTactics) * (turn === 'R' ? 1 : -1);
  }

  const origAlpha = alpha;
  const ttIdx = hLo & TT_MASK;
  let ttMove = 0;
  if (ttDepth[ttIdx] > 0 && ttKeyLo[ttIdx] === hLo && ttKeyHi[ttIdx] === hHi) {
    ttMove = ttBestMove[ttIdx];
    if (ttDepth[ttIdx] >= depth && ply > 0) {
      const tts = ttScore[ttIdx];
      const flg = ttFlag[ttIdx];
      if (flg === 1) return tts;
      if (flg === 2 && tts >= beta) return tts;
      if (flg === 3 && tts <= alpha) return tts;
    }
  }

  const nextTurn = turn === 'R' ? 'B' : 'R';

  // Null-Move Pruning (空著裁剪)
  if (allowNull && !inChk && depth >= 3 && ply > 0) {
    const nullR = depth >= 6 ? 3 : 2;
    const nullScore = -negamax(
      board, depth - 1 - nullR, -beta, -beta + 1, nextTurn, ply + 1,
      (hLo ^ Z_SIDE_LO) >>> 0, (hHi ^ Z_SIDE_HI) >>> 0,
      false, useTactics, qMax, deadline, false
    );
    if (ply < 64) pathHashLo[ply] = hLo;
    if (searchAborted) return 0;
    if (nullScore >= beta) return beta;
  }

  const moves = generateOrderedMoves(board, turn, ply, ttMove, false);
  let best = -Infinity;
  let bestCode = 0;
  let legalCount = 0;

  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    const mover = board[m.fr][m.fc];
    const captured = board[m.tr][m.tc];
    if (captured && captured.t === 'K') return 19500 - ply * 10;

    board[m.tr][m.tc] = mover;
    board[m.fr][m.fc] = null;
    if (isInCheck(board, turn)) {
      board[m.fr][m.fc] = mover;
      board[m.tr][m.tc] = captured;
      continue;
    }
    legalCount++;

    const givesCheck = isInCheck(board, nextTurn);
    const pIdx = PIECE_IDX[mover.s + '_' + mover.t];
    const fromSq = m.fr * 9 + m.fc;
    const toSq = m.tr * 9 + m.tc;
    let nextLo = (hLo ^ ZOBRIST_LO[pIdx][fromSq] ^ ZOBRIST_LO[pIdx][toSq] ^ Z_SIDE_LO) >>> 0;
    let nextHi = (hHi ^ ZOBRIST_HI[pIdx][fromSq] ^ ZOBRIST_HI[pIdx][toSq] ^ Z_SIDE_HI) >>> 0;
    if (captured) {
      const cIdx = PIECE_IDX[captured.s + '_' + captured.t];
      nextLo = (nextLo ^ ZOBRIST_LO[cIdx][toSq]) >>> 0;
      nextHi = (nextHi ^ ZOBRIST_HI[cIdx][toSq]) >>> 0;
    }

    let score;
    if (legalCount === 1) {
      score = -negamax(board, depth - 1, -beta, -alpha, nextTurn, ply + 1, nextLo, nextHi, true, useTactics, qMax, deadline, givesCheck);
    } else {
      let reduction = 0;
      // 將軍著法 (givesCheck) 與吃子著法絕不減深，確保臥槽馬/悶宮殺棋不被 LMR 漏算
      if (legalCount >= 4 && depth >= 3 && !inChk && !givesCheck && !captured) {
        reduction = (legalCount >= 10 && depth >= 5) ? 2 : 1;
      }
      score = -negamax(board, depth - 1 - reduction, -alpha - 1, -alpha, nextTurn, ply + 1, nextLo, nextHi, true, useTactics, qMax, deadline, givesCheck);
      if (!searchAborted && score > alpha && reduction > 0) {
        score = -negamax(board, depth - 1, -alpha - 1, -alpha, nextTurn, ply + 1, nextLo, nextHi, true, useTactics, qMax, deadline, givesCheck);
      }
      if (!searchAborted && score > alpha && score < beta) {
        score = -negamax(board, depth - 1, -beta, -alpha, nextTurn, ply + 1, nextLo, nextHi, true, useTactics, qMax, deadline, givesCheck);
      }
    }

    board[m.fr][m.fc] = mover;
    board[m.tr][m.tc] = captured;

    if (searchAborted) return 0;

    if (score > best) {
      best = score;
      bestCode = m.code;
    }
    if (score > alpha) alpha = score;
    if (alpha >= beta) {
      if (!captured && ply < 32) {
        if (killerMove1[ply] !== m.code) {
          killerMove2[ply] = killerMove1[ply];
          killerMove1[ply] = m.code;
        }
        const hKey = fromSq * 90 + toSq;
        historyHeuristic[hKey] = Math.min(100000, historyHeuristic[hKey] + depth * depth * 12);
      }
      break;
    }
  }

  if (legalCount === 0) return -19000 + ply * 10;

  if (!searchAborted) {
    ttKeyLo[ttIdx] = hLo;
    ttKeyHi[ttIdx] = hHi;
    ttDepth[ttIdx] = depth;
    ttScore[ttIdx] = best;
    ttBestMove[ttIdx] = bestCode;
    ttFlag[ttIdx] = best <= origAlpha ? 3 : (best >= beta ? 2 : 1);
  }
  return best;
}

// 擴充實戰常見開局轉移定式（修正「1.炮二平五 馬２進３ 2.兵七進一」脫譜架中炮問題，支援左右鏡像）
const EXTRA_BOOK_LINES = [
  {
    title: '中炮七路兵對屏風馬',
    moves: [
      { f: [7, 7], t: [7, 4], c: '炮二平五立中炮。' },
      { f: [0, 1], t: [2, 2], c: '馬２進３正馬應對。' },
      { f: [6, 2], t: [5, 2], c: '兵七進一先挺七路兵活馬。' },
      { f: [0, 7], t: [2, 6], c: '馬８進７穩健成屏風馬，不急於架空頭順炮。' },
      { f: [9, 7], t: [7, 6], c: '傌二進三正馬。' },
      { f: [3, 6], t: [4, 6], c: '卒７進１對挺七路卒制馬。' },
      { f: [9, 8], t: [9, 7], c: '俥一平二出直車。' },
      { f: [0, 8], t: [0, 7], c: '車９平８堂堂正正出直車。' }
    ]
  },
  {
    title: '中炮進三兵對屏風馬',
    moves: [
      { f: [7, 7], t: [7, 4], c: '炮二平五立中炮。' },
      { f: [0, 1], t: [2, 2], c: '馬２進３正馬。' },
      { f: [6, 6], t: [5, 6], c: '兵三進一挺三路兵。' },
      { f: [0, 7], t: [2, 6], c: '馬８進７成屏風馬雙馬護中。' },
      { f: [9, 7], t: [7, 6], c: '傌二進三出馬。' },
      { f: [3, 2], t: [4, 2], c: '卒３進１通馬路。' }
    ]
  }
];

function findOpeningBookMove(board, side) {
  if (curStep >= 14) return null;
  const candidates = [];
  const allBooks = [...Object.values(PRESETS), ...EXTRA_BOOK_LINES];
  for (const preset of allBooks) {
    if (preset.moves.length <= curStep) continue;
    for (const mirror of [false, true]) {
      let match = true;
      for (let i = 0; i < curStep; i++) {
        const hm = history[i + 1].lastMove;
        const pm = preset.moves[i];
        const pfc = mirror ? 8 - pm.f[1] : pm.f[1];
        const ptc = mirror ? 8 - pm.t[1] : pm.t[1];
        if (!hm || hm.fr !== pm.f[0] || hm.fc !== pfc || hm.tr !== pm.t[0] || hm.tc !== ptc) {
          match = false;
          break;
        }
      }
      if (match) {
        const nextPm = preset.moves[curStep];
        const fr = nextPm.f[0], fc = mirror ? 8 - nextPm.f[1] : nextPm.f[1];
        const tr = nextPm.t[0], tc = mirror ? 8 - nextPm.t[1] : nextPm.t[1];
        const p = board[fr] && board[fr][fc];
        if (p && p.s === side) {
          const legal = getLegalMoves(board, fr, fc);
          if (legal.some(([lr, lc]) => lr === tr && lc === tc)) {
            candidates.push({ fr, fc, tr, tc, comment: `【AI 定式庫・${preset.title}】${nextPm.c}` });
          }
        }
      }
    }
  }
  if (candidates.length === 0) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

// ==================== 對手回合靜默背景推演引擎 (Silent Time-Sliced Pondering) ====================
let ponderTimer = null;
let ponderState = null;
let lastCompletedPonder = null;

function stopPondering(preserveForNextTurn = false) {
  if (ponderTimer !== null) {
    clearTimeout(ponderTimer);
    ponderTimer = null;
  }
  if (preserveForNextTurn && ponderState && ponderState.totalNodes > 0) {
    lastCompletedPonder = {
      step: ponderState.step,
      nodes: ponderState.totalNodes,
      depth: ponderState.reachedDepth
    };
  } else if (!preserveForNextTurn) {
    lastCompletedPonder = null;
  }
  ponderState = null;
}

function startPonderingIfNeeded() {
  stopPondering(false);
  if (aiMode === 'off' || aiThinking) return;
  const cur = history[curStep];
  if (!cur || cur.turn === aiMode) return;
  const state = evaluateGameState(cur.board, cur.turn);
  if (state.over) return;

  const prof = AI_PROFILES[aiLevel] || AI_PROFILES[4];
  const workBoard = cloneBoard(cur.board);
  const [rootLo, rootHi] = computeBoardHash(workBoard, cur.turn);
  const rootTtIdx = rootLo & TT_MASK;
  const rootTtMove = (ttDepth[rootTtIdx] > 0 && ttKeyLo[rootTtIdx] === rootLo && ttKeyHi[rootTtIdx] === rootHi)
    ? ttBestMove[rootTtIdx]
    : 0;
  const rootMoves = getAllLegalMoves(workBoard, cur.turn, false, rootTtMove);
  if (rootMoves.length === 0) return;

  const ponderHashSet = new Set();
  for (let s = 0; s < curStep; s++) {
    const [hLo] = computeBoardHash(history[s].board, history[s].turn);
    ponderHashSet.add(hLo);
  }

  const maxDepth = aiLevel === 1 ? 5 : Math.min(18, prof.depth + 2);
  ponderState = {
    session: aiSessionId,
    step: curStep,
    side: cur.turn,
    aiSide: aiMode,
    prof,
    workBoard,
    rootLo,
    rootHi,
    rootMoves,
    ponderHashSet,
    d: 2,
    maxDepth,
    moveIdx: 0,
    alpha: -Infinity,
    beta: Infinity,
    iterBestMove: rootMoves[0],
    iterBestScore: -Infinity,
    reachedDepth: 1,
    totalNodes: 0,
    sliceRetries: 0,
    done: false
  };
  ponderTimer = setTimeout(runPonderSlice, 30);
}

function runPonderSlice() {
  ponderTimer = null;
  if (!ponderState || ponderState.done || ponderState.session !== aiSessionId || aiThinking || aiMode === 'off') {
    return;
  }
  const cur = history[curStep];
  if (!cur || curStep !== ponderState.step || cur.turn !== ponderState.side) {
    stopPondering(false);
    return;
  }

  gameHashSet = ponderState.ponderHashSet;
  pathHashLo[0] = ponderState.rootLo;
  searchNodes = 0;
  searchAborted = false;
  const sliceDeadline = performance.now() + 18; // 每次僅占用 18ms 時間切片，確保 60fps 零延遲點擊體驗
  const { workBoard, rootMoves, prof, rootLo, rootHi, aiSide } = ponderState;

  while (ponderState.d <= ponderState.maxDepth) {
    const d = ponderState.d;
    const i = ponderState.moveIdx;
    const m = rootMoves[i];
    const mover = workBoard[m.fr][m.fc];
    const captured = workBoard[m.tr][m.tc];
    workBoard[m.tr][m.tc] = mover;
    workBoard[m.fr][m.fc] = null;

    const givesCheck = isInCheck(workBoard, aiSide);
    const pIdx = PIECE_IDX[mover.s + '_' + mover.t];
    const fromSq = m.fr * 9 + m.fc;
    const toSq = m.tr * 9 + m.tc;
    let nextLo = (rootLo ^ ZOBRIST_LO[pIdx][fromSq] ^ ZOBRIST_LO[pIdx][toSq] ^ Z_SIDE_LO) >>> 0;
    let nextHi = (rootHi ^ ZOBRIST_HI[pIdx][fromSq] ^ ZOBRIST_HI[pIdx][toSq] ^ Z_SIDE_HI) >>> 0;
    if (captured) {
      const cIdx = PIECE_IDX[captured.s + '_' + captured.t];
      nextLo = (nextLo ^ ZOBRIST_LO[cIdx][toSq]) >>> 0;
      nextHi = (nextHi ^ ZOBRIST_HI[cIdx][toSq]) >>> 0;
    }

    let score;
    if (i < 3) {
      score = -negamax(
        workBoard, d - 1, -Infinity, Infinity, aiSide, 1,
        nextLo, nextHi, true, prof.useTactics, prof.qMax, sliceDeadline, givesCheck
      );
    } else {
      score = -negamax(
        workBoard, d - 1, -ponderState.alpha - 1, -ponderState.alpha, aiSide, 1,
        nextLo, nextHi, true, prof.useTactics, prof.qMax, sliceDeadline, givesCheck
      );
      if (!searchAborted && score > ponderState.alpha) {
        score = -negamax(
          workBoard, d - 1, -Infinity, -ponderState.alpha, aiSide, 1,
          nextLo, nextHi, true, prof.useTactics, prof.qMax, sliceDeadline, givesCheck
        );
      }
    }

    workBoard[m.fr][m.fc] = mover;
    workBoard[m.tr][m.tc] = captured;

    if (searchAborted) {
      ponderState.sliceRetries++;
      if (ponderState.sliceRetries <= 35) {
        break;
      }
      searchAborted = false;
      ponderState.sliceRetries = 0;
      ponderState.moveIdx++;
    } else {
      ponderState.sliceRetries = 0;
      m.lastScore = score;
      if (score > ponderState.iterBestScore) {
        ponderState.iterBestScore = score;
        ponderState.iterBestMove = m;
      }
      if (score > ponderState.alpha) {
        ponderState.alpha = score;
      }
      ponderState.moveIdx++;
    }

    if (ponderState.moveIdx >= rootMoves.length) {
      ponderState.reachedDepth = d;
      rootMoves.sort((a, b) => (b.lastScore ?? -999999) - (a.lastScore ?? -999999));
      const bestHm = rootMoves[0];
      const rTtIdx = rootLo & TT_MASK;
      ttKeyLo[rTtIdx] = rootLo;
      ttKeyHi[rTtIdx] = rootHi;
      ttDepth[rTtIdx] = d;
      ttScore[rTtIdx] = ponderState.iterBestScore;
      ttBestMove[rTtIdx] = bestHm.code;
      ttFlag[rTtIdx] = 1;

      if (Math.abs(ponderState.iterBestScore) > 18000 || d >= ponderState.maxDepth) {
        ponderState.done = true;
        break;
      }
      ponderState.d++;
      ponderState.moveIdx = 0;
      ponderState.alpha = -Infinity;
      ponderState.beta = Infinity;
      ponderState.iterBestMove = rootMoves[0];
      ponderState.iterBestScore = -Infinity;
    }

    if (performance.now() >= sliceDeadline) break;
  }

  ponderState.totalNodes += searchNodes;
  if (!ponderState.done) {
    ponderTimer = setTimeout(runPonderSlice, 5);
  }
}

function computeBestMove(board, side, level) {
  const prof = AI_PROFILES[level] || AI_PROFILES[4];
  if (level >= 1) {
    const bookMove = findOpeningBookMove(board, side);
    if (bookMove) return bookMove;
  }

  const workBoard = cloneBoard(board);
  const [rootLo, rootHi] = computeBoardHash(workBoard, side);
  const rootTtIdx = rootLo & TT_MASK;
  const hasRootTt = (ttDepth[rootTtIdx] > 0 && ttKeyLo[rootTtIdx] === rootLo && ttKeyHi[rootTtIdx] === rootHi);
  const rootTtMove = hasRootTt ? ttBestMove[rootTtIdx] : 0;

  const rootMoves = getAllLegalMoves(workBoard, side, false, rootTtMove);
  if (rootMoves.length === 0) return null;
  if (rootMoves.length === 1) {
    const only = rootMoves[0];
    return { fr: only.fr, fc: only.fc, tr: only.tr, tc: only.tc, comment: `【${prof.name}】唯一合法應著。` };
  }

  const ponderBonusNodes = (lastCompletedPonder && lastCompletedPonder.step === curStep - 1)
    ? lastCompletedPonder.nodes
    : 0;
  lastCompletedPonder = null;

  searchNodes = 0;
  searchAborted = false;
  killerMove1.fill(0);
  killerMove2.fill(0);
  for (let i = 0; i < historyHeuristic.length; i++) historyHeuristic[i] >>= 1;

  gameHashSet = new Set();
  for (let s = 0; s < curStep; s++) {
    const [hLo] = computeBoardHash(history[s].board, history[s].turn);
    gameHashSet.add(hLo);
  }

  pathHashLo[0] = rootLo;
  const startTime = performance.now();
  const deadline = startTime + prof.timeMs;
  const nextTurn = side === 'R' ? 'B' : 'R';
  let chosenMove = rootMoves[0];
  let chosenScore = (hasRootTt && ttFlag[rootTtIdx] === 1) ? ttScore[rootTtIdx] : -Infinity;
  let reachedDepth = (hasRootTt && ttFlag[rootTtIdx] === 1) ? Math.min(prof.depth, ttDepth[rootTtIdx]) : 1;
  let maxTargetDepth = prof.depth;

  for (let d = 2; d <= maxTargetDepth; d++) {
    let alpha = -Infinity, beta = Infinity;
    let iterBestMove = rootMoves[0];
    let iterBestScore = -Infinity;

    for (let i = 0; i < rootMoves.length; i++) {
      if (d >= 3 && performance.now() > deadline) {
        searchAborted = true;
        break;
      }
      const m = rootMoves[i];
      const mover = workBoard[m.fr][m.fc];
      const captured = workBoard[m.tr][m.tc];
      workBoard[m.tr][m.tc] = mover;
      workBoard[m.fr][m.fc] = null;

      const givesCheck = isInCheck(workBoard, nextTurn);
      const pIdx = PIECE_IDX[mover.s + '_' + mover.t];
      const fromSq = m.fr * 9 + m.fc;
      const toSq = m.tr * 9 + m.tc;
      let nextLo = (rootLo ^ ZOBRIST_LO[pIdx][fromSq] ^ ZOBRIST_LO[pIdx][toSq] ^ Z_SIDE_LO) >>> 0;
      let nextHi = (rootHi ^ ZOBRIST_HI[pIdx][fromSq] ^ ZOBRIST_HI[pIdx][toSq] ^ Z_SIDE_HI) >>> 0;
      if (captured) {
        const cIdx = PIECE_IDX[captured.s + '_' + captured.t];
        nextLo = (nextLo ^ ZOBRIST_LO[cIdx][toSq]) >>> 0;
        nextHi = (nextHi ^ ZOBRIST_HI[cIdx][toSq]) >>> 0;
      }

      let score;
      if (i === 0 || prof.jitter > 0) {
        score = -negamax(
          workBoard, d - 1, -beta, -alpha, nextTurn, 1,
          nextLo, nextHi, true, prof.useTactics, prof.qMax, deadline, givesCheck
        );
      } else {
        score = -negamax(
          workBoard, d - 1, -alpha - 1, -alpha, nextTurn, 1,
          nextLo, nextHi, true, prof.useTactics, prof.qMax, deadline, givesCheck
        );
        if (!searchAborted && score > alpha) {
          score = -negamax(
            workBoard, d - 1, -beta, -alpha, nextTurn, 1,
            nextLo, nextHi, true, prof.useTactics, prof.qMax, deadline, givesCheck
          );
        }
      }
      workBoard[m.fr][m.fc] = mover;
      workBoard[m.tr][m.tc] = captured;

      if (searchAborted) break;

      if (prof.jitter > 0) {
        score += (Math.random() * 2 - 1) * prof.jitter;
      }
      m.lastScore = score;
      if (score > iterBestScore) {
        iterBestScore = score;
        iterBestMove = m;
      }
      if (score > alpha) alpha = score;
    }

    if (!searchAborted) {
      chosenMove = iterBestMove;
      chosenScore = iterBestScore;
      reachedDepth = d;
      rootMoves.sort((a, b) => (b.lastScore ?? -999999) - (a.lastScore ?? -999999));
      ttKeyLo[rootTtIdx] = rootLo;
      ttKeyHi[rootTtIdx] = rootHi;
      ttDepth[rootTtIdx] = d;
      ttScore[rootTtIdx] = chosenScore;
      ttBestMove[rootTtIdx] = chosenMove.code;
      ttFlag[rootTtIdx] = 1;
      if (chosenScore > 18000) break;
      if (d === prof.depth && prof.jitter === 0 && ponderBonusNodes > 1000) {
        const elapsed = performance.now() - startTime;
        if (elapsed < prof.timeMs * 0.25) maxTargetDepth = Math.min(18, prof.depth + 2);
        else if (elapsed < prof.timeMs * 0.5) maxTargetDepth = Math.min(18, prof.depth + 1);
      }
    } else {
      if (iterBestMove !== rootMoves[0] && rootMoves[0].lastScore !== undefined && iterBestScore > rootMoves[0].lastScore) {
        chosenMove = iterBestMove;
        chosenScore = iterBestScore;
      }
      break;
    }
  }

  const evalPawn = (chosenScore / 100).toFixed(1);
  const sign = chosenScore >= 0 ? '+' : '';
  const scoreDesc = Math.abs(chosenScore) > 18000
    ? (chosenScore > 0 ? '必勝殺棋!' : '面臨絕殺')
    : `${sign}${evalPawn} 兵`;
  const totalEvaluatedNodes = searchNodes + ponderBonusNodes;
  return {
    fr: chosenMove.fr,
    fc: chosenMove.fc,
    tr: chosenMove.tr,
    tc: chosenMove.tc,
    comment: `【${prof.name} (${prof.title})・算深 ${reachedDepth} 層 (${(totalEvaluatedNodes / 1000).toFixed(1)}k 節點)｜評估：${scoreDesc}】`
  };
}

function onAiConfigChange() {
  stopPondering(false);
  const modeVal = document.getElementById('aiModeSelect').value;
  const lvVal = parseInt(document.getElementById('aiLevelSelect').value, 10);
  aiMode = ['off', 'B', 'R'].includes(modeVal) ? modeVal : 'off';
  aiLevel = [1, 2, 3, 4, 5].includes(lvVal) ? lvVal : 4;
  aiSessionId++;
  aiThinking = false;
  hintMove = null;
  renderAll();
  maybeTriggerAi();
}

function maybeTriggerAi() {
  if (aiMode === 'off') {
    stopPondering(false);
    return;
  }
  const cur = history[curStep];
  if (!cur) return;
  const state = evaluateGameState(cur.board, cur.turn);
  if (state.over) {
    stopPondering(false);
    return;
  }
  // 當輪到人類玩家行棋時，立即啟動背景時間切片預思考 (Pondering)
  if (cur.turn !== aiMode) {
    startPonderingIfNeeded();
    return;
  }

  stopPondering(true);
  const session = ++aiSessionId;
  aiThinking = true;
  renderAll();

  setTimeout(() => {
    if (session !== aiSessionId) return;
    const latest = history[curStep];
    if (!latest || latest.turn !== aiMode) {
      aiThinking = false;
      renderAll();
      return;
    }
    const best = computeBestMove(latest.board, latest.turn, aiLevel);
    aiThinking = false;
    if (!best) {
      renderAll();
      return;
    }
    const legal = getLegalMoves(latest.board, best.fr, best.fc);
    if (legal.some(([lr, lc]) => lr === best.tr && lc === best.tc)) {
      makeMove(best.fr, best.fc, best.tr, best.tc, best.comment);
    } else {
      renderAll();
    }
  }, 60);
}

function requestAiHint() {
  if (aiThinking) return;
  const cur = history[curStep];
  const state = evaluateGameState(cur.board, cur.turn);
  if (state.over) return;

  stopPondering(true);
  if (hintMove) {
    const { fr, fc, tr, tc, comment } = hintMove;
    const legal = getLegalMoves(cur.board, fr, fc);
    if (legal.some(([lr, lc]) => lr === tr && lc === tc)) {
      makeMove(fr, fc, tr, tc, comment || '採納 AI 支招建議。');
      return;
    }
  }

  const best = computeBestMove(cur.board, cur.turn, Math.max(aiLevel, 4));
  if (!best) return;
  const notation = getNotation(cur.board, best.fr, best.fc, best.tr, best.tc);
  hintMove = { ...best, notation };
  selected = [best.fr, best.fc];
  validMoves = getLegalMoves(cur.board, best.fr, best.fc);
  renderAll();
  startPonderingIfNeeded();
}

document.getElementById('presetSelect').addEventListener('change', e => {
  const key = e.target.value;
  if (!key || !Object.prototype.hasOwnProperty.call(PRESETS, key)) return;
  if (loadAndVerifySteps(PRESETS[key].title, PRESETS[key].moves)) {
    goStep(0);
  }
});

function isValidCoordPair(pair) {
  return Array.isArray(pair) &&
    pair.length === 2 &&
    Number.isInteger(pair[0]) && pair[0] >= 0 && pair[0] <= 9 &&
    Number.isInteger(pair[1]) && pair[1] >= 0 && pair[1] <= 8;
}

function getSavedRecords() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const safe = Object.create(null);
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      for (const k of Object.keys(raw)) {
        if (!FORBIDDEN_KEYS.has(k)) safe[k] = raw[k];
      }
    }
    return safe;
  } catch {
    return Object.create(null);
  }
}

function refreshSavedSelect(selectedTitle = '') {
  const records = getSavedRecords();
  const keys = Object.keys(records);
  const sel = document.getElementById('savedSelect');
  sel.replaceChildren();
  const defaultOpt = document.createElement('option');
  defaultOpt.value = '';
  defaultOpt.textContent = `-- 我的存檔棋譜庫 (${keys.length}) --`;
  sel.appendChild(defaultOpt);

  keys.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    const stepLen = (records[k] && Array.isArray(records[k].steps)) ? records[k].steps.length : 0;
    opt.textContent = `${k} (${stepLen}步)`;
    if (k === selectedTitle) opt.selected = true;
    sel.appendChild(opt);
  });
}

function saveCurrentRecord() {
  const defaultName = history[0].comment !== '初始盤面，紅方先行。' ? history[0].comment : `自訂打譜_${new Date().toLocaleDateString()}`;
  const rawTitle = prompt('請輸入要儲存的棋譜名稱（最多 60 字元）：', defaultName);
  if (!rawTitle) return;
  const title = rawTitle.trim();
  if (!title) return;
  if (title.length > 60) {
    alert('棋譜名稱不可超過 60 個字元！');
    return;
  }
  if (FORBIDDEN_KEYS.has(title)) {
    alert('此名稱為系統保留字，請使用其他名稱！');
    return;
  }
  const records = getSavedRecords();
  records[title] = {
    title,
    updatedAt: new Date().toISOString(),
    steps: history.slice(1).map(h => ({ f: [h.lastMove.fr, h.lastMove.fc], t: [h.lastMove.tr, h.lastMove.tc], c: h.comment }))
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch (err) {
    alert('瀏覽器儲存空間不足，無法儲存棋譜！');
    return;
  }
  history[0].comment = title;
  refreshSavedSelect(title);
  renderAll();
  alert(`已成功儲存棋譜：「${title}」！`);
}

function loadAndVerifySteps(title, steps) {
  if (!Array.isArray(steps)) {
    alert('棋譜格式錯誤：steps 必須為陣列！');
    return false;
  }
  if (steps.length > MAX_STEPS) {
    alert(`棋譜步數超過上限（最多 ${MAX_STEPS} 步），已中止載入！`);
    return false;
  }

  const prevHistory = history;
  const prevStep = curStep;
  resetGame(true);
  if (typeof title === 'string' && title.trim()) {
    history[0].comment = title.trim().slice(0, 60);
  }

  for (let i = 0; i < steps.length; i++) {
    const m = steps[i];
    if (!m || typeof m !== 'object' || !isValidCoordPair(m.f) || !isValidCoordPair(m.t)) {
      history = prevHistory;
      curStep = prevStep;
      renderAll();
      alert(`載入失敗：第 ${i + 1} 步座標格式不合法或超出棋盤範圍！`);
      return false;
    }
    const [fr, fc] = m.f;
    const [tr, tc] = m.t;
    const cur = history[curStep];
    if (evaluateGameState(cur.board, cur.turn).over) {
      history = prevHistory;
      curStep = prevStep;
      renderAll();
      alert(`載入失敗：第 ${i + 1} 步前牌局已終局，不可繼續行棋！`);
      return false;
    }
    const piece = cur.board[fr][fc];
    if (!piece || piece.s !== cur.turn) {
      history = prevHistory;
      curStep = prevStep;
      renderAll();
      alert(`載入失敗：第 ${i + 1} 步不合法（起點無子或非該方輪次）！`);
      return false;
    }
    const legalMoves = getLegalMoves(cur.board, fr, fc);
    if (!legalMoves.some(([lr, lc]) => lr === tr && lc === tc)) {
      history = prevHistory;
      curStep = prevStep;
      renderAll();
      alert(`載入失敗：第 ${i + 1} 步違反象棋規則或導致將帥受威脅！`);
      return false;
    }
    const comment = typeof m.c === 'string' ? m.c.slice(0, 2000) : '';
    makeMove(fr, fc, tr, tc, comment, true);
  }
  return true;
}

function loadSavedRecord() {
  const title = document.getElementById('savedSelect').value;
  if (!title || FORBIDDEN_KEYS.has(title)) return;
  const records = getSavedRecords();
  const rec = records[title];
  if (!rec) return;
  if (loadAndVerifySteps(rec.title || title, rec.steps || [])) {
    goStep(0);
  }
}

function deleteSavedRecord() {
  const title = document.getElementById('savedSelect').value;
  if (!title || FORBIDDEN_KEYS.has(title)) { alert('請先從下拉選單選擇要刪除的存檔棋譜！'); return; }
  if (!confirm(`確定要刪除存檔棋譜「${title}」嗎？`)) return;
  const records = getSavedRecords();
  delete records[title];
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch (err) {
    alert('更新存檔庫失敗！');
    return;
  }
  refreshSavedSelect();
}

function openModal() {
  const data = {
    title: history[0].comment,
    steps: history.slice(1).map(h => ({ f: [h.lastMove.fr, h.lastMove.fc], t: [h.lastMove.tr, h.lastMove.tc], c: h.comment }))
  };
  document.getElementById('ioTextarea').value = JSON.stringify(data, null, 2);
  document.getElementById('ioModal').classList.add('open');
}
function closeModal() { document.getElementById('ioModal').classList.remove('open'); }
function copyIO() {
  const ta = document.getElementById('ioTextarea');
  ta.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).catch(() => document.execCommand('copy'));
  } else {
    document.execCommand('copy');
  }
}
function importJSON() {
  let data;
  try {
    data = JSON.parse(document.getElementById('ioTextarea').value);
  } catch (err) {
    alert('棋譜 JSON 格式錯誤，請確認貼上的內容是否完整！');
    return;
  }
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    alert('棋譜 JSON 結構不正確！');
    return;
  }
  if (loadAndVerifySteps(data.title || '', data.steps || [])) {
    closeModal();
  }
}

window.addEventListener('keydown', e => {
  if (['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') goStep(curStep - 1);
  if (e.key === 'ArrowRight') goStep(curStep + 1);
});

resetGame();
refreshSavedSelect();
try {
  validateAllPresets();
} catch (err) {
  console.error(err);
  document.getElementById('verifyBadge').textContent = err.message;
}
</script>
